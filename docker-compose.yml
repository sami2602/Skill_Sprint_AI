version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillsprint-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=skillsprint-ai-super-secret-jwt-key-2026-phase7-production-secure
      - DATABASE_URL=sqlite:///./skillsprint.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
